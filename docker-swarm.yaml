      - target: ${TRELLO_TCP_PORT:-3021}
        published: ${TRELLO_TCP_PORT:-3021}
        protocol: tcp
    volumes:
      - .:/usr/src/app
    depends_on:
      - db

  users:
    image: my_stack/users:latest
    command: npm run start:dev users
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_HOST=db
